# ============================================================
# Big Data Lambda Architecture - Docker Compose
# E-Commerce Analytics Platform
# ============================================================
#
# `docker compose up -d` starts only the core: Kafka, MinIO, PostgreSQL,
# Redis and Elasticsearch, plus their one-shot init containers. Everything
# else runs under a profile (Phase 8 plan section 7.2):
#
#   crawl   crawl-worker           ingest  silver-sink
#   speed   speed                  batch   batch-scheduler, batch-once
#   serve   kibana, superset,      legacy  the Kaggle demo (Spark 3.5.1)
#           kibana-marketplace-setup
#   ops     ops (run --rm tool),   smoke   stub-source, the offline Tiki stub
#           es-projector
#
# scripts/mp.ps1 wraps all of this; see docs/RUNBOOK.md.
#
# Host ports come from .env (see .env.example), so a machine whose ports are
# taken needs no override file.
#
# Every container_name carries ${MP_CONTAINER_PREFIX} (empty by default), so a
# second project -- env/bench.env, env/demo.env -- can run beside the live
# collection stack instead of stopping it (Phase 9 plan section 5). Container-side values stay literal: a
# developer's .env holds host-side addresses such as localhost:9010, which
# must never reach a container.

x-marketplace-env: &marketplace-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  POSTGRES_HOST: postgres-dw
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
  POSTGRES_DB: ${POSTGRES_DB:-data_warehouse}
  DATA_LAKE_PROFILE: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_USE_SSL: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ES_HOST: http://elasticsearch:9200

x-marketplace-python: &marketplace-python
  build:
    context: .
    dockerfile: docker/marketplace-python/Dockerfile
  image: ecommerce/marketplace-python:1
  volumes:
    # Read-only: data goes to MinIO, PostgreSQL or a named volume.
    - ./:/app:ro
  networks:
    - bigdata

x-spark-marketplace: &spark-marketplace
  build:
    context: .
    dockerfile: docker/spark-marketplace/Dockerfile
  image: ecommerce/spark-marketplace:4.0.1
  # Spark may write scratch files into its working directory; /app is read-only.
  working_dir: /tmp
  volumes:
    - ./:/app:ro
  networks:
    - bigdata

x-core-ready: &core-ready
  kafka-init:
    condition: service_completed_successfully
  minio-init:
    condition: service_completed_successfully
  postgres-dw:
    condition: service_healthy

services:
  # ── INGESTION LAYER ─────────────────────────────────────────
  kafka:
    image: apache/kafka:4.2.0
    container_name: ${MP_CONTAINER_PREFIX:-}kafka
    restart: unless-stopped
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      # The host listener must advertise the published port, not the container's.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092},PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # On a named volume: a recreated container (any config change does it)
      # would otherwise start with empty topics, and the speed query, whose
      # checkpoint remembers the old offsets, stops on the apparent data loss.
      # The image ships this directory owned by its appuser, so a fresh volume
      # inherits that ownership.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      # Tools inside the container use the internal listener. The host one
      # advertises localhost:${KAFKA_HOST_PORT}, which nothing serves in here
      # once that port is not 9092; kafka-topics.sh, which follows metadata,
      # hangs on it (checked 2026-10-02). This check happens not to, but stays
      # on the same listener as the other in-container tools.
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bigdata

  # The three frozen marketplace topics (Brief section 11), created
  # idempotently. The legacy ecommerce_events topic stays with start_all.ps1.
  kafka-init:
    image: apache/kafka:4.2.0
    container_name: ${MP_CONTAINER_PREFIX:-}kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in marketplace.observations.v1 marketplace.observations.v1.dlq marketplace.changes.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$topic" --partitions ${KAFKA_MARKETPLACE_PARTITIONS:-3} --replication-factor 1
        done
        echo "marketplace topics ready"
    networks:
      - bigdata

  # ── MARKETPLACE SERVICES ───────────────────────────────────
  crawl-worker:
    <<: *marketplace-python
    profiles: ["crawl", "demo", "bench"]
    container_name: ${MP_CONTAINER_PREFIX:-}crawl-worker
    restart: unless-stopped
    command: ["python", "-m", "crawler.service"]
    environment:
      <<: *marketplace-env
      # A drill starts a second worker under another ID; two workers sharing
      # one would complete each other's leases.
      CRAWL_SERVICE_WORKER_ID: ${CRAWL_SERVICE_WORKER_ID:-crawl-worker}
      # Overridable so a smoke or drill can point the crawler at a stub.
      TIKI_LISTING_URL: ${TIKI_LISTING_URL:-https://tiki.vn/api/personalish/v1/blocks/listings}
      # The smoke recrawls its ACTIVE tasks every minute instead of every hour.
      CRAWL_ACTIVE_CADENCE_MINUTES: ${CRAWL_ACTIVE_CADENCE_MINUTES:-60}
      # The drills shorten these; the defaults match config/settings.py.
      CRAWL_LEASE_SECONDS: ${CRAWL_LEASE_SECONDS:-300}
      CRAWL_RETRY_BASE_SECONDS: ${CRAWL_RETRY_BASE_SECONDS:-30}
      CRAWL_RETRY_MAX_SECONDS: ${CRAWL_RETRY_MAX_SECONDS:-1800}
      CRAWL_CIRCUIT_OPEN_SECONDS: ${CRAWL_CIRCUIT_OPEN_SECONDS:-900}
      # Politeness between requests. The crawl benchmark runs once at this
      # default and once at 0 (Phase 9 plan section 8); live keeps 2.0.
      CRAWL_REQUEST_DELAY_SECONDS: ${CRAWL_REQUEST_DELAY_SECONDS:-2.0}
      SERVICE_HEARTBEAT_FILE: /tmp/heartbeat
    # SIGTERM finishes the cycle in hand: up to CRAWL_WORKER_BATCH_SIZE pages
    # at CRAWL_REQUEST_DELAY_SECONDS each, plus their fetches.
    stop_grace_period: 120s
    healthcheck:
      # One cycle plus the idle wait, three times over.
      test: ["CMD", "python", "-m", "common.heartbeat", "--check", "/tmp/heartbeat", "--max-age", "600"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on: *core-ready

  silver-sink:
    <<: *marketplace-python
    profiles: ["ingest", "demo", "bench"]
    container_name: ${MP_CONTAINER_PREFIX:-}silver-sink
    restart: unless-stopped
    command: ["python", "-m", "data_ingestion.marketplace_silver_service"]
    environment:
      <<: *marketplace-env
      SERVICE_HEARTBEAT_FILE: /tmp/heartbeat
    healthcheck:
      # Beats once per poll; three of the longest retry backoff (60 s).
      test: ["CMD", "python", "-m", "common.heartbeat", "--check", "/tmp/heartbeat", "--max-age", "180"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on: *core-ready

  speed:
    <<: *spark-marketplace
    profiles: ["speed", "demo", "bench"]
    container_name: ${MP_CONTAINER_PREFIX:-}speed
    restart: unless-stopped
    command: ["python3", "-m", "speed_layer.marketplace_speed_service"]
    environment:
      <<: *marketplace-env
      MARKETPLACE_SPEED_CHECKPOINT_ROOT: /data/checkpoints
      # Bumped by drill D5 to force a full replay from a fresh checkpoint.
      MARKETPLACE_STREAM_CHECKPOINT_VERSION: ${MARKETPLACE_STREAM_CHECKPOINT_VERSION:-v1}
      # Overridden only by the speed-cost and speed-soak benchmarks.
      MARKETPLACE_STREAM_TRIGGER: ${MARKETPLACE_STREAM_TRIGGER:-30 seconds}
      MARKETPLACE_SPEED_MAX_OFFSETS_PER_TRIGGER: ${MARKETPLACE_SPEED_MAX_OFFSETS_PER_TRIGGER:-0}
    volumes:
      - ./:/app:ro
      - speed_checkpoints:/data/checkpoints
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "pgrep", "-f", "speed_layer.marketplace_speed_service"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      <<: *core-ready
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  batch-scheduler:
    <<: *spark-marketplace
    profiles: ["batch", "demo"]
    container_name: ${MP_CONTAINER_PREFIX:-}batch-scheduler
    restart: unless-stopped
    command: ["python3", "-m", "batch_layer.marketplace_scheduler"]
    environment:
      <<: *marketplace-env
    # A stop waits for the batch in progress; see run_scheduler().
    stop_grace_period: 30m
    healthcheck:
      test: ["CMD", "pgrep", "-f", "batch_layer.marketplace_scheduler"]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on: *core-ready

  # Operator commands, never started by `up`:
  #   docker compose --profile batch run --rm batch-once \
  #     python3 -m batch_layer.marketplace_warehouse --run-id ... --as-of ... [--resume]
  batch-once:
    <<: *spark-marketplace
    profiles: ["batch", "demo", "bench"]
    command: ["python3", "-m", "batch_layer.marketplace_warehouse", "--help"]
    restart: "no"
    environment:
      <<: *marketplace-env
      # The smoke judges a window minutes old, so it shortens the settle delay.
      MARKETPLACE_QUALITY_RECONCILIATION_SETTLE_SECONDS: ${MARKETPLACE_QUALITY_RECONCILIATION_SETTLE_SECONDS:-900}
    depends_on: *core-ready

  # ── OPERATIONS ─────────────────────────────────────────────
  # The tool container behind scripts/mp.ps1: `run --rm ops python -m ops ...`.
  ops:
    <<: *marketplace-python
    profiles: ["ops"]
    command: ["python", "-m", "ops", "--help"]
    restart: "no"
    environment:
      <<: *marketplace-env
      MARKETPLACE_QUALITY_RECONCILIATION_SETTLE_SECONDS: ${MARKETPLACE_QUALITY_RECONCILIATION_SETTLE_SECONDS:-900}
      CRAWL_ACTIVE_CADENCE_MINUTES: ${CRAWL_ACTIVE_CADENCE_MINUTES:-60}
    volumes:
      - ./:/app:ro
      # validate --json writes its report here, the one writable path.
      - ./data/ops:/reports
      # Read-only, for the storage snapshot (Phase 9 plan section 6.3): Kafka
      # 4 no longer answers the DescribeLogDirs versions kafka-python speaks.
      - kafka_data:/kafka-data:ro
    depends_on: *core-ready

  # Projects audit and the DLQ into the four marketplace-* operational indices
  # (plan section 11.2). Read-only towards the pipeline: no lock, no
  # PostgreSQL write, and the only offsets it advances are its own, committed
  # after the records are indexed.
  es-projector:
    <<: *marketplace-python
    profiles: ["ops", "demo"]
    container_name: ${MP_CONTAINER_PREFIX:-}es-projector
    restart: unless-stopped
    command: ["python", "-m", "ops.es_projector"]
    environment:
      <<: *marketplace-env
      SERVICE_HEARTBEAT_FILE: /tmp/heartbeat
      MARKETPLACE_OPS_PROJECT_INTERVAL_SECONDS: ${MARKETPLACE_OPS_PROJECT_INTERVAL_SECONDS:-30}
      MARKETPLACE_OPS_PROJECT_OVERLAP_SECONDS: ${MARKETPLACE_OPS_PROJECT_OVERLAP_SECONDS:-900}
    volumes:
      - ./:/app:ro
      # Read-only: the daily storage snapshot sizes Kafka's partition logs.
      - kafka_data:/kafka-data:ro
    healthcheck:
      # Beats once per pass, failed pass included; three intervals' grace,
      # plus the DLQ drain poll.
      test: ["CMD", "python", "-m", "common.heartbeat", "--check", "/tmp/heartbeat", "--max-age", "180"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      <<: *core-ready
      elasticsearch:
        condition: service_healthy

  # Offline stand-in for the Tiki listing API (plan section 8). The smoke and
  # the drills set TIKI_LISTING_URL to http://stub-source:8000/...
  stub-source:
    <<: *marketplace-python
    profiles: ["smoke", "demo", "bench"]
    container_name: ${MP_CONTAINER_PREFIX:-}stub-source
    restart: unless-stopped
    # Phase 9 plan section 7: a benchmark widens the stub. The defaults are
    # the Phase 8 smoke's universe; an empty STUB_ROWS_PER_PAGE serves the
    # fixture once per page.
    command: ["sh", "-c", "exec python -m ops.stub_source --port 8000 --last-page ${STUB_LAST_PAGE:-2} $${STUB_ROWS_PER_PAGE:+--rows-per-page $$STUB_ROWS_PER_PAGE}"]
    environment:
      STUB_ROWS_PER_PAGE: ${STUB_ROWS_PER_PAGE:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/robots.txt', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s

  # ── LEGACY KAGGLE DEMO (Spark 3.5.1) ───────────────────────
  spark:
    profiles: ["legacy"]
    image: apache/spark:3.5.1
    container_name: ${MP_CONTAINER_PREFIX:-}spark
    hostname: spark
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      SPARK_PUBLIC_DNS: localhost
    ports:
      - "${SPARK_UI_HOST_PORT:-8080}:8080"   # Spark Master Web UI
      - "${SPARK_RPC_HOST_PORT:-7077}:7077"  # Spark Master RPC
    networks:
      - bigdata

  spark-worker:
    profiles: ["legacy"]
    image: apache/spark:3.5.1
    container_name: ${MP_CONTAINER_PREFIX:-}spark-worker
    hostname: spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark:7077
    environment:
      SPARK_PUBLIC_DNS: localhost
      # The Kaggle months are 5-9 GB of CSV each. A 2g worker cannot hold even
      # one shuffle stage of that and dies with OOM/heartbeat timeouts, which
      # reads like an infrastructure failure but is purely this number.
      # Override per machine via .env; 8g/4 cores fits a 16 GB laptop.
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-8g}
    ports:
      - "${SPARK_WORKER_UI_HOST_PORT:-8081}:8081"   # Spark Worker Web UI
    depends_on:
      - spark
    networks:
      - bigdata

  # Reproducible batch runtime with pinned PostgreSQL JDBC and MinIO S3A jars.
  # Kept on its own `jobs` profile: scripts/run_warehouse.ps1 runs it with
  # `--profile jobs run --rm`, and under `legacy` an `up` would start it.
  warehouse-job:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/spark-warehouse/Dockerfile
    image: ecommerce/spark-warehouse:3.5.1
    container_name: ${MP_CONTAINER_PREFIX:-}warehouse-job
    environment:
      DATA_LAKE_MODE: s3a
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_BRONZE: ecommerce-bronze
      MINIO_BUCKET_SILVER: ecommerce-silver
      MINIO_BUCKET_GOLD: ecommerce-gold
      POSTGRES_HOST: postgres-dw
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-data_warehouse}
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    volumes:
      - ./:/app
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres-dw:
        condition: service_healthy
    networks:
      - bigdata

  # ── DATA LAKE (MinIO - S3 Compatible) ──────────────────────
  minio:
    # MinIO no longer publishes pullable images (every Docker Hub and quay.io
    # tag answers `denied`, checked 2026-10-02). Pinned by the digest of the
    # copy already cached here; see docs/RUNBOOK.md for how to get one.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    pull_policy: missing
    container_name: ${MP_CONTAINER_PREFIX:-}minio
    restart: unless-stopped
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bigdata

  # MinIO Client - tao bucket khi khoi dong
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    pull_policy: missing
    container_name: ${MP_CONTAINER_PREFIX:-}minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb local/ecommerce-bronze --ignore-existing &&
      mc mb local/ecommerce-silver --ignore-existing &&
      mc mb local/ecommerce-gold --ignore-existing &&
      echo 'MinIO Bronze/Silver/Gold buckets created successfully'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - bigdata

  # ── SERVING LAYER STORAGE ──────────────────────────────────
  redis:
    image: redis:8.6.2
    container_name: ${MP_CONTAINER_PREFIX:-}redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigdata

  postgres-dw:
    image: postgres:18.3
    container_name: ${MP_CONTAINER_PREFIX:-}postgres-dw
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - POSTGRES_DB=${POSTGRES_DB:-data_warehouse}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigdata

  # ── SEARCH & ANALYTICS ─────────────────────────────────────
  elasticsearch:
    # 8.18.1, not 8.18.0: on the development machine the 8.18.0 image was
    # pulled while the disk was full and its snapshot stayed corrupt across
    # re-pulls (PROGRESS.md section 13.4). Kibana is pinned to the same patch.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
    container_name: ${MP_CONTAINER_PREFIX:-}elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.monitoring.collection.enabled=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    networks:
      - bigdata

  kibana:
    # Also under `legacy`, whose dashboard importer depends on it.
    profiles: ["serve", "legacy", "demo"]
    image: docker.elastic.co/kibana/kibana:8.18.1
    container_name: ${MP_CONTAINER_PREFIX:-}kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=a7a6311933d3503b89bc2dbc36572c33a6c10925682e591bffcab6911c06786d
      - XPACK_REPORTING_ENCRYPTIONKEY=a7a6311933d3503b89bc2dbc36572c33a6c10925682e591bffcab6911c06786d
      - XPACK_SECURITY_ENCRYPTIONKEY=a7a6311933d3503b89bc2dbc36572c33a6c10925682e591bffcab6911c06786d
      - KIBANA_DEFAULTAPPID=dashboards
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: curl -sf http://localhost:5601/api/status || exit 1
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - bigdata

  # Install the marketplace index templates and import the two dashboards
  # (plan section 11.3). Idempotent: templates are PUT by name, saved objects
  # imported with overwrite=true.
  kibana-marketplace-setup:
    <<: *marketplace-python
    profiles: ["serve", "demo"]
    container_name: ${MP_CONTAINER_PREFIX:-}kibana-marketplace-setup
    restart: "no"
    command: ["python", "-m", "display.kibana.setup_marketplace_kibana"]
    environment:
      <<: *marketplace-env
      KIBANA_HOST: http://kibana:5601
    depends_on:
      kibana:
        condition: service_healthy

  # Auto-import the legacy Kaggle dashboards.
  kibana-setup:
    profiles: ["legacy"]
    image: python:3.12-slim
    container_name: ${MP_CONTAINER_PREFIX:-}kibana-setup
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - ./display/kibana:/app/kibana
    working_dir: /app
    command: >
      /bin/sh -c "
      pip install requests==2.32.3 elasticsearch==8.18.0 --quiet;
      python kibana/setup_kibana.py;
      echo 'Kibana setup completed!';
      "
    networks:
      - bigdata

  # ── SERVING LAYER BI (Apache Superset) ─────────────────────
  superset:
    profiles: ["serve", "demo"]
    image: apache/superset:4.1.1
    container_name: ${MP_CONTAINER_PREFIX:-}superset
    command: >
      /bin/sh -c "
      pip install psycopg2-binary --quiet;
      python /app/custom_config/patch_runtime.py;
      /usr/bin/run-server.sh
      "
    environment:
      - SUPERSET_CONFIG_PATH=/app/custom_config/superset_config.py
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"
    volumes:
      - ./display/superset:/app/custom_config
      - superset_home:/app/superset_home
    depends_on:
      postgres-dw:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bigdata

  superset-init:
    profiles: ["serve", "demo"]
    image: apache/superset:4.1.1
    container_name: ${MP_CONTAINER_PREFIX:-}superset-init
    user: root
    environment:
      - SUPERSET_CONFIG_PATH=/app/custom_config/superset_config.py
    volumes:
      - ./display/superset:/app/custom_config
      - superset_home:/app/superset_home
    depends_on:
      postgres-dw:
        condition: service_healthy
    command: >
      /bin/sh -c "chmod +x /app/custom_config/setup_superset.sh && /app/custom_config/setup_superset.sh"
    networks:
      - bigdata

# ── NETWORKS & VOLUMES ──────────────────────────────────────
networks:
  bigdata:
    driver: bridge

volumes:
  kafka_data:
  minio_data:
  redis_data:
  pg_data:
  es_data:
  superset_home:
  speed_checkpoints:
