# ============================================================
# Big Data Lambda Architecture - Docker Compose
# E-Commerce Analytics Platform
# ============================================================
#
# `docker compose up -d` starts only the core: Kafka, MinIO, PostgreSQL,
# Redis and Elasticsearch, plus their one-shot init containers. Everything
# else runs under a profile (Phase 8 plan section 7.2):
#
#   crawl          crawl-worker (Tiki, python image)
#   crawl-browser  crawl-worker-lazada (crawler-browser image, one tab)
#   speed          speed (Spark): marketplace.records.v1 -> changes, ES, Redis
#   batch          batch-once, the tool behind `python -m ecomdata.processing.batch run`
#   orchestration  airflow-init, airflow-api-server, airflow-scheduler,
#                  airflow-dag-processor: DAGs marketplace_batch,
#                  marketplace_maintenance, source_discovery
#   legacy-scheduler  batch-scheduler, the pre-Airflow loop (kept, not default)
#   serve          kibana, superset, kibana-marketplace-setup
#   ops            ops (run --rm tool), es-projector
#   smoke          stub-source, the offline Tiki stub
#   legacy         the Kaggle demo (Spark 3.5.1): compose/docker-compose.legacy.yml
#
# Files (all relative to the repository root, which is mounted at /app):
#   compose/docker-compose.yml                this file
#   compose/docker-compose.legacy.yml         Kaggle demo, add it with -f
#   compose/docker-compose.observability.yml  Loki, Promtail, Grafana, add it with -f
# The root docker-compose.yml includes this file, so `docker compose -f
# docker-compose.yml` keeps working.
#
# Settings layer as env/base.env + env/ports.<stack>.env + env/<stack>.env;
# scripts/mp.ps1 loads them. A run without it must export the same variables
# (the secrets below are required, with no default).
#
# scripts/mp.ps1 wraps all of this; see docs/RUNBOOK.md.
#
# Host ports come from .env (see .env.example), so a machine whose ports are
# taken needs no override file.
#
# Every container_name carries ${MP_CONTAINER_PREFIX} (empty by default), so a
# second project -- env/bench.env, env/demo.env, env/refactor.env -- can run beside the live
# collection stack instead of stopping it (Phase 9 plan section 5). Container-side values stay literal: a
# developer's .env holds host-side addresses such as localhost:9010, which
# must never reach a container.

x-marketplace-env: &marketplace-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  POSTGRES_HOST: postgres-dw
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
  POSTGRES_DB: ${POSTGRES_DB:-data_warehouse}
  DATA_LAKE_PROFILE: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_USE_SSL: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ES_HOST: http://elasticsearch:9200
  # The package lives under src/; the source is mounted, not installed.
  PYTHONPATH: /app/src:/app:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip

x-marketplace-python: &marketplace-python
  build:
    context: ..
    dockerfile: docker/python/Dockerfile
  image: ecommerce/marketplace-python:2
  volumes:
    # Read-only: data goes to MinIO, PostgreSQL or a named volume.
    - ../:/app:ro
  networks:
    - bigdata

x-spark-marketplace: &spark-marketplace
  build:
    context: ..
    dockerfile: docker/spark/Dockerfile
  image: ecommerce/spark-marketplace:4.0.1-r2
  # Spark may write scratch files into its working directory; /app is read-only.
  working_dir: /tmp
  volumes:
    - ../:/app:ro
  networks:
    - bigdata

x-airflow: &airflow
  build:
    context: ..
    dockerfile: docker/airflow/Dockerfile
  image: ecommerce/airflow:3.3.2-r1
  profiles: ["orchestration"]
  environment:
    <<: *marketplace-env
    # The package is installed in this image; the working tree's source path in
    # marketplace-env would shadow Airflow's own modules.
    PYTHONPATH: ""
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres-dw:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY, see env/base.env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET, see env/base.env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET, see env/base.env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    # What the DAGs hand to their task containers.
    AIRFLOW_SPARK_IMAGE: ${AIRFLOW_SPARK_IMAGE:-ecommerce/spark-marketplace:4.0.1-r2}
    AIRFLOW_PYTHON_IMAGE: ${AIRFLOW_PYTHON_IMAGE:-ecommerce/marketplace-python:2}
    AIRFLOW_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-mp}_bigdata
    AIRFLOW_DOCKER_URL: unix://var/run/docker.sock
    # Host path of the working tree; set to run task containers on it instead
    # of the code baked into their image (a host path, as the Docker daemon sees it).
    AIRFLOW_SOURCE_MOUNT: ${AIRFLOW_SOURCE_MOUNT:-}
    CRAWL_REQUEST_DELAY_SECONDS: ${CRAWL_REQUEST_DELAY_SECONDS:-2.0}
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
    MARKETPLACE_QUALITY_RECONCILIATION_SETTLE_SECONDS: ${MARKETPLACE_QUALITY_RECONCILIATION_SETTLE_SECONDS:-900}
  volumes:
    - ../src/ecomdata/orchestration/dags:/opt/airflow/dags:ro
    - ../scripts/create_airflow_db.py:/opt/airflow/scripts/create_airflow_db.py:ro
    - /var/run/docker.sock:/var/run/docker.sock
  # Airflow's own user, in group 0: the socket in the Docker Desktop VM is
  # root:root, and a task launcher needs to write to it. Root itself would not
  # see the user-site packages the image installs Airflow into.
  user: "50000:0"
  networks:
    - bigdata

x-core-ready: &core-ready
  kafka-init:
    condition: service_completed_successfully
  minio-init:
    condition: service_completed_successfully
  postgres-dw:
    condition: service_healthy

services:
  # ── INGESTION LAYER ─────────────────────────────────────────
  kafka:
    image: apache/kafka:4.2.0
    container_name: ${MP_CONTAINER_PREFIX:-}kafka
    restart: unless-stopped
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      # The host listener must advertise the published port, not the container's.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092},PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # On a named volume: a recreated container (any config change does it)
      # would otherwise start with empty topics, and the speed query, whose
      # checkpoint remembers the old offsets, stops on the apparent data loss.
      # The image ships this directory owned by its appuser, so a fresh volume
      # inherits that ownership.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      # Tools inside the container use the internal listener. The host one
      # advertises localhost:${KAFKA_HOST_PORT}, which nothing serves in here
      # once that port is not 9092; kafka-topics.sh, which follows metadata,
      # hangs on it (checked 2026-10-02). This check happens not to, but stays
      # on the same listener as the other in-container tools.
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bigdata

  # The marketplace topics, created idempotently: source records (+ DLQ) and
  # changes. marketplace.observations.v1 has no producer and no consumer any
  # more. The legacy ecommerce_events topic stays with the Kaggle scripts.
  kafka-init:
    image: apache/kafka:4.2.0
    container_name: ${MP_CONTAINER_PREFIX:-}kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in marketplace.records.v1 marketplace.records.v1.dlq marketplace.observations.v1 marketplace.changes.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$topic" --partitions ${KAFKA_MARKETPLACE_PARTITIONS:-3} --replication-factor 1
        done
        echo "marketplace topics ready"
    networks:
      - bigdata

  # ── MARKETPLACE SERVICES ───────────────────────────────────
  crawl-worker:
    <<: *marketplace-python
    profiles: ["crawl", "demo", "bench"]
    container_name: ${MP_CONTAINER_PREFIX:-}crawl-worker
    restart: unless-stopped
    # CRAWL_SOURCES names the sources this worker crawls (comma-separated).
    command: ["python", "-m", "ecomdata.ingestion.service", "--sources", "${CRAWL_SOURCES:-tiki}"]
    environment:
      <<: *marketplace-env
      # A drill starts a second worker under another ID; two workers sharing
      # one would complete each other's leases.
      CRAWL_SERVICE_WORKER_ID: ${CRAWL_SERVICE_WORKER_ID:-crawl-worker}
      # Overridable so a smoke or drill can point the crawler at a stub.
      TIKI_BASE_URL: ${TIKI_BASE_URL:-}
      # The smoke recrawls its ACTIVE tasks every minute instead of every hour.
      CRAWL_ACTIVE_CADENCE_MINUTES: ${CRAWL_ACTIVE_CADENCE_MINUTES:-60}
      # The drills shorten these; the defaults match config/settings.py.
      CRAWL_LEASE_SECONDS: ${CRAWL_LEASE_SECONDS:-300}
      CRAWL_RETRY_BASE_SECONDS: ${CRAWL_RETRY_BASE_SECONDS:-30}
      CRAWL_RETRY_MAX_SECONDS: ${CRAWL_RETRY_MAX_SECONDS:-1800}
      CRAWL_CIRCUIT_OPEN_SECONDS: ${CRAWL_CIRCUIT_OPEN_SECONDS:-900}
      # Politeness between requests. The crawl benchmark runs once at this
      # default and once at 0 (Phase 9 plan section 8); live keeps 2.0.
      CRAWL_REQUEST_DELAY_SECONDS: ${CRAWL_REQUEST_DELAY_SECONDS:-2.0}
      SERVICE_HEARTBEAT_FILE: /tmp/heartbeat
    # SIGTERM finishes the cycle in hand: up to CRAWL_WORKER_BATCH_SIZE pages
    # at CRAWL_REQUEST_DELAY_SECONDS each, plus their fetches.
    stop_grace_period: 120s
    healthcheck:
      # One cycle plus the idle wait, three times over.
      test: ["CMD", "python", "-m", "ecomdata.infra.heartbeat", "--check", "/tmp/heartbeat", "--max-age", "600"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on: *core-ready

  # The same worker for sources that need a browser: Chromium, one tab, the
  # project's honest user agent, and Lazada's floor of 5 s per page enforced by
  # its source spec. It leases only the sources it names.
  crawl-worker-lazada:
    build:
      context: ..
      dockerfile: docker/crawler-browser/Dockerfile
    image: ecommerce/crawler-browser:1
    profiles: ["crawl-browser"]
    container_name: ${MP_CONTAINER_PREFIX:-}crawl-worker-lazada
    restart: unless-stopped
    command: ["python", "-m", "ecomdata.ingestion.service", "--sources", "lazada"]
    # Chromium needs a real /dev/shm and an init process to reap its children.
    init: true
    ipc: host
    shm_size: 1gb
    working_dir: /app
    volumes:
      - ../:/app:ro
    environment:
      <<: *marketplace-env
      CRAWL_SERVICE_WORKER_ID: ${LAZADA_WORKER_ID:-crawl-worker-lazada}
      LAZADA_BASE_URL: ${LAZADA_BASE_URL:-}
      CRAWL_ACTIVE_CADENCE_MINUTES: ${CRAWL_ACTIVE_CADENCE_MINUTES:-60}
      CRAWL_LEASE_SECONDS: ${CRAWL_LEASE_SECONDS:-300}
      CRAWL_RETRY_BASE_SECONDS: ${CRAWL_RETRY_BASE_SECONDS:-30}
      CRAWL_RETRY_MAX_SECONDS: ${CRAWL_RETRY_MAX_SECONDS:-1800}
      CRAWL_CIRCUIT_OPEN_SECONDS: ${CRAWL_CIRCUIT_OPEN_SECONDS:-900}
      CRAWL_REQUEST_DELAY_SECONDS: ${CRAWL_REQUEST_DELAY_SECONDS:-2.0}
      CRAWL_BROWSER_TIMEOUT_SECONDS: ${CRAWL_BROWSER_TIMEOUT_SECONDS:-45}
      CRAWL_BROWSER_SETTLE_SECONDS: ${CRAWL_BROWSER_SETTLE_SECONDS:-3}
      CRAWL_WORKER_BATCH_SIZE: ${LAZADA_WORKER_BATCH_SIZE:-1}
      SERVICE_HEARTBEAT_FILE: /tmp/heartbeat
    networks:
      - bigdata
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "python", "-m", "ecomdata.infra.heartbeat", "--check", "/tmp/heartbeat", "--max-age", "900"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on: *core-ready

  speed:
    <<: *spark-marketplace
    profiles: ["speed", "demo", "bench"]
    container_name: ${MP_CONTAINER_PREFIX:-}speed
    restart: unless-stopped
    command: ["python3", "-m", "ecomdata.processing.speed.service"]
    environment:
      <<: *marketplace-env
      MARKETPLACE_SPEED_CHECKPOINT_ROOT: /data/checkpoints
      # Bumped by drill D5 to force a full replay from a fresh checkpoint.
      MARKETPLACE_STREAM_CHECKPOINT_VERSION: ${MARKETPLACE_STREAM_CHECKPOINT_VERSION:-v1}
      # Overridden only by the speed-cost and speed-soak benchmarks.
      MARKETPLACE_STREAM_TRIGGER: ${MARKETPLACE_STREAM_TRIGGER:-30 seconds}
      MARKETPLACE_SPEED_MAX_OFFSETS_PER_TRIGGER: ${MARKETPLACE_SPEED_MAX_OFFSETS_PER_TRIGGER:-0}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
    volumes:
      - ../:/app:ro
      - speed_checkpoints:/data/checkpoints
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "pgrep", "-f", "ecomdata.processing.speed.service"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      <<: *core-ready
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # The pre-Airflow loop, kept for hosts without Airflow. Not part of any default stack.
  batch-scheduler:
    <<: *spark-marketplace
    profiles: ["legacy-scheduler"]
    container_name: ${MP_CONTAINER_PREFIX:-}batch-scheduler
    restart: unless-stopped
    command: ["python3", "-m", "ecomdata.processing.batch.scheduler"]
    environment:
      <<: *marketplace-env
    # A stop waits for the batch in progress; see run_scheduler().
    stop_grace_period: 30m
    healthcheck:
      test: ["CMD", "pgrep", "-f", "ecomdata.processing.batch.scheduler"]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on: *core-ready

  # Operator commands, never started by `up`:
  #   docker compose --profile batch run --rm batch-once \
  #     python3 -m ecomdata.processing.batch run --run-id ... --as-of ... --all [--resume]
  # One stage at a time: --stage silver|marts|quality|publish|promote. Airflow runs the
  # same command, one task per stage.
  batch-once:
    <<: *spark-marketplace
    profiles: ["batch", "demo", "bench"]
    command: ["python3", "-m", "ecomdata.processing.batch", "--help"]
    restart: "no"
    environment:
      <<: *marketplace-env
      # The smoke judges a window minutes old, so it shortens the settle delay.
      MARKETPLACE_QUALITY_RECONCILIATION_SETTLE_SECONDS: ${MARKETPLACE_QUALITY_RECONCILIATION_SETTLE_SECONDS:-900}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
    depends_on: *core-ready

  # ── OPERATIONS ─────────────────────────────────────────────
  # The tool container behind scripts/mp.ps1: `run --rm ops python -m ecomdata.ops ...`.
  ops:
    <<: *marketplace-python
    profiles: ["ops"]
    command: ["python", "-m", "ecomdata.ops", "--help"]
    restart: "no"
    environment:
      <<: *marketplace-env
      MARKETPLACE_QUALITY_RECONCILIATION_SETTLE_SECONDS: ${MARKETPLACE_QUALITY_RECONCILIATION_SETTLE_SECONDS:-900}
      CRAWL_ACTIVE_CADENCE_MINUTES: ${CRAWL_ACTIVE_CADENCE_MINUTES:-60}
    volumes:
      - ../:/app:ro
      # validate --json writes its report here, the one writable path.
      - ../data/ops:/reports
      # Read-only, for the storage snapshot (Phase 9 plan section 6.3): Kafka
      # 4 no longer answers the DescribeLogDirs versions kafka-python speaks.
      - kafka_data:/kafka-data:ro
    depends_on: *core-ready

  # Projects audit and the DLQ into the four marketplace-* operational indices
  # (plan section 11.2). Read-only towards the pipeline: no lock, no
  # PostgreSQL write, and the only offsets it advances are its own, committed
  # after the records are indexed.
  es-projector:
    <<: *marketplace-python
    profiles: ["ops", "demo"]
    container_name: ${MP_CONTAINER_PREFIX:-}es-projector
    restart: unless-stopped
    command: ["python", "-m", "ecomdata.serving.es_projector"]
    environment:
      <<: *marketplace-env
      SERVICE_HEARTBEAT_FILE: /tmp/heartbeat
      MARKETPLACE_OPS_PROJECT_INTERVAL_SECONDS: ${MARKETPLACE_OPS_PROJECT_INTERVAL_SECONDS:-30}
      MARKETPLACE_OPS_PROJECT_OVERLAP_SECONDS: ${MARKETPLACE_OPS_PROJECT_OVERLAP_SECONDS:-900}
    volumes:
      - ../:/app:ro
      # Read-only: the daily storage snapshot sizes Kafka's partition logs.
      - kafka_data:/kafka-data:ro
    healthcheck:
      # Beats once per pass, failed pass included; three intervals' grace,
      # plus the DLQ drain poll.
      test: ["CMD", "python", "-m", "ecomdata.infra.heartbeat", "--check", "/tmp/heartbeat", "--max-age", "180"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      <<: *core-ready
      elasticsearch:
        condition: service_healthy

  # Offline stand-in for the Tiki category pages. The smoke and the drills set
  # TIKI_BASE_URL to http://stub-source:8000.
  stub-source:
    <<: *marketplace-python
    profiles: ["smoke", "demo", "bench"]
    container_name: ${MP_CONTAINER_PREFIX:-}stub-source
    restart: unless-stopped
    # A benchmark widens the stub; an empty STUB_ROWS_PER_PAGE serves the
    # fixture once per category page.
    command: ["sh", "-c", "exec python -m services.stub_source --port 8000 $${STUB_ROWS_PER_PAGE:+--rows-per-page $$STUB_ROWS_PER_PAGE}"]
    environment:
      STUB_ROWS_PER_PAGE: ${STUB_ROWS_PER_PAGE:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/robots.txt', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s

  # ── DATA LAKE (MinIO - S3 Compatible) ──────────────────────
  minio:
    # MinIO no longer publishes pullable images (every Docker Hub and quay.io
    # tag answers `denied`, checked 2026-10-02). Pinned by the digest of the
    # copy already cached here; see docs/RUNBOOK.md for how to get one.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    pull_policy: missing
    container_name: ${MP_CONTAINER_PREFIX:-}minio
    restart: unless-stopped
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bigdata

  # MinIO Client - tao bucket khi khoi dong
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    pull_policy: missing
    container_name: ${MP_CONTAINER_PREFIX:-}minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb local/ecommerce-bronze --ignore-existing &&
      mc mb local/ecommerce-silver --ignore-existing &&
      mc mb local/ecommerce-gold --ignore-existing &&
      echo 'MinIO Bronze/Silver/Gold buckets created successfully'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - bigdata

  # ── SERVING LAYER STORAGE ──────────────────────────────────
  redis:
    image: redis:8.6.2
    container_name: ${MP_CONTAINER_PREFIX:-}redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigdata

  postgres-dw:
    image: postgres:18.3
    container_name: ${MP_CONTAINER_PREFIX:-}postgres-dw
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - POSTGRES_DB=${POSTGRES_DB:-data_warehouse}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigdata

  # ── SEARCH & ANALYTICS ─────────────────────────────────────
  elasticsearch:
    # 8.18.1, not 8.18.0: on the development machine the 8.18.0 image was
    # pulled while the disk was full and its snapshot stayed corrupt across
    # re-pulls (PROGRESS.md section 13.4). Kibana is pinned to the same patch.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
    container_name: ${MP_CONTAINER_PREFIX:-}elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.monitoring.collection.enabled=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    networks:
      - bigdata

  kibana:
    # Also under `legacy`, whose dashboard importer depends on it.
    profiles: ["serve", "legacy", "demo"]
    image: docker.elastic.co/kibana/kibana:8.18.1
    container_name: ${MP_CONTAINER_PREFIX:-}kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      # Required, 32+ characters: env/base.env carries a development value.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY, see env/base.env}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY, see env/base.env}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY, see env/base.env}
      - KIBANA_DEFAULTAPPID=dashboards
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: curl -sf http://localhost:5601/api/status || exit 1
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - bigdata

  # Install the marketplace index templates and import the two dashboards
  # (plan section 11.3). Idempotent: templates are PUT by name, saved objects
  # imported with overwrite=true.
  kibana-marketplace-setup:
    <<: *marketplace-python
    profiles: ["serve", "demo"]
    container_name: ${MP_CONTAINER_PREFIX:-}kibana-marketplace-setup
    restart: "no"
    command: ["python", "-m", "ecomdata.serving.kibana.setup_marketplace_kibana"]
    environment:
      <<: *marketplace-env
      KIBANA_HOST: http://kibana:5601
    depends_on:
      kibana:
        condition: service_healthy

  # ── SERVING LAYER BI (Apache Superset) ─────────────────────
  superset:
    profiles: ["serve", "demo"]
    image: apache/superset:4.1.1
    container_name: ${MP_CONTAINER_PREFIX:-}superset
    command: >
      /bin/sh -c "
      pip install psycopg2-binary --quiet;
      python /app/custom_config/patch_runtime.py;
      /usr/bin/run-server.sh
      "
    environment:
      - SUPERSET_CONFIG_PATH=/app/custom_config/superset_config.py
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"
    volumes:
      - ../docker/superset:/app/custom_config
      - superset_home:/app/superset_home
    depends_on:
      postgres-dw:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bigdata

  superset-init:
    profiles: ["serve", "demo"]
    image: apache/superset:4.1.1
    container_name: ${MP_CONTAINER_PREFIX:-}superset-init
    user: root
    environment:
      - SUPERSET_CONFIG_PATH=/app/custom_config/superset_config.py
    volumes:
      - ../docker/superset:/app/custom_config
      - superset_home:/app/superset_home
    depends_on:
      postgres-dw:
        condition: service_healthy
    command: >
      /bin/sh -c "chmod +x /app/custom_config/setup_superset.sh && /app/custom_config/setup_superset.sh"
    networks:
      - bigdata

  # ── ORCHESTRATION (Airflow 3, LocalExecutor) ───────────────
  # Metadata lives in the database `airflow` of postgres-dw. Tasks are
  # DockerOperator containers started through the Docker socket on this stack's
  # network, from the images named below; the DAGs are mounted, not baked.
  airflow-init:
    <<: *airflow
    container_name: ${MP_CONTAINER_PREFIX:-}airflow-init
    restart: "no"
    command:
      - bash
      - -c
      - |
        set -e
        python /opt/airflow/scripts/create_airflow_db.py
        airflow db migrate
        echo "airflow metadata database ready"
    depends_on:
      postgres-dw:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow
    container_name: ${MP_CONTAINER_PREFIX:-}airflow-api-server
    restart: unless-stopped
    command: ["airflow", "api-server"]
    ports:
      - "${AIRFLOW_HOST_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2/monitor/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    container_name: ${MP_CONTAINER_PREFIX:-}airflow-scheduler
    restart: unless-stopped
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    container_name: ${MP_CONTAINER_PREFIX:-}airflow-dag-processor
    restart: unless-stopped
    command: ["airflow", "dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

# ── NETWORKS & VOLUMES ──────────────────────────────────────
networks:
  bigdata:
    driver: bridge

volumes:
  kafka_data:
  minio_data:
  redis_data:
  pg_data:
  es_data:
  superset_home:
  speed_checkpoints:
