databases:
  - database_name: ecommerce_dw
    sqlalchemy_uri: postgresql://admin:password@postgres-dw:5432/data_warehouse
    expose_in_sqllab: true
    allow_run_async: false
    tables:
      - table_name: fact_events
        schema: public
      - table_name: mv_sales_summary
        schema: public
      - table_name: mv_product_ranking
        schema: public
      - table_name: mv_category_performance
        schema: public
      - table_name: mv_user_segments
        schema: public
      - table_name: mv_funnel_analysis
        schema: public
      - table_name: ml_price_forecast
        schema: public
